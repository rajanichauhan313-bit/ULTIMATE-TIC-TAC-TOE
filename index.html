<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Nexro Tic Tac Toe</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:

radial-gradient(
circle at top left,
#7c3aed55,
transparent 30%
),

radial-gradient(
circle at bottom right,
#06b6d455,
transparent 30%
),

linear-gradient(
135deg,
#050816,
#111827
);

color:white;

min-height:100vh;

display:flex;

justify-content:center;
align-items:center;

overflow:hidden;

}

.glow{

position:absolute;

width:450px;
height:450px;

filter:blur(120px);

opacity:.25;

border-radius:50%;

}

.g1{

background:#7c3aed;

left:-150px;
top:-150px;

}

.g2{

background:#06b6d4;

right:-150px;
bottom:-150px;

}

.screen{

display:none;

width:100%;

justify-content:center;
align-items:center;

flex-direction:column;

animation:fade .3s;

}

.active{

display:flex;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(20px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

.card{

background:

rgba(255,255,255,.06);

padding:35px;

border-radius:30px;

backdrop-filter:
blur(16px);

border:

1px solid
rgba(255,255,255,.08);

box-shadow:

0 0 40px
rgba(0,0,0,.45);

text-align:center;

}

.title{

font-size:4rem;

font-weight:900;

background:

linear-gradient(
90deg,
cyan,
violet
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.sub{

opacity:.7;

margin-bottom:20px;

}

button{

border:none;

cursor:pointer;

transition:.2s;

}

.menuBtn{

width:260px;

padding:15px;

margin:7px;

border-radius:16px;

background:

linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

font-weight:700;

color:white;

}

.menuBtn:hover{

transform:

translateY(-3px)
scale(1.03);

}

.board{

display:grid;

gap:10px;

margin:20px;

justify-content:center;

}

.cell{

width:85px;
height:85px;

background:

rgba(255,255,255,.08);

border-radius:18px;

display:flex;

justify-content:center;
align-items:center;

font-size:2rem;

cursor:pointer;

transition:.2s;

}

.cell:hover{

transform:scale(1.06);

}

.x{

color:#67e8f9;

text-shadow:

0 0 14px
#67e8f9;

}

.o{

color:#ff74e9;

text-shadow:

0 0 14px
#ff74e9;

}

.timer{

width:260px;

height:8px;

background:#222;

border-radius:20px;

overflow:hidden;

margin:10px;

display:none;

}

.fill{

height:100%;

width:100%;

background:

linear-gradient(
90deg,
cyan,
violet
);

}

.rankBox{

padding:12px;

border-radius:15px;

background:

rgba(255,255,255,.07);

margin-bottom:12px;

}

.status{

font-size:1.2rem;

margin-bottom:10px;

}

.controls{

display:flex;

gap:10px;

justify-content:center;

flex-wrap:wrap;

}

.control{

padding:12px 18px;

border-radius:12px;

background:

rgba(255,255,255,.08);

color:white;

}

.footer{

margin-top:18px;

font-size:.82rem;

opacity:.55;

}

</style>

</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<!-- MAIN MENU -->

<div
class="screen active"
id="menu">

<div class="card">

<div class="title">

TIC TAC TOE

</div>

<div class="sub">

Ultimate Neon Edition

</div>

<button
class="menuBtn"
onclick="openCasual()">

👥 Casual

</button>

<button
class="menuBtn"
onclick="rankedGame()">

🏆 Ranked

</button>

<button
class="menuBtn"
onclick="openBots()">

🤖 Bots

</button>

<button
class="menuBtn"
onclick="speedrun()">

⚡ Speedrun

</button>

<div class="footer">

@nexro v:0.01

</div>

</div>

</div>

<!-- CASUAL -->

<div
class="screen"
id="casual">

<div class="card">

<h2>

Casual Modes

</h2>

<button
class="menuBtn"
onclick="startPvP(2)">

2 Players

</button>

<button
class="menuBtn"
onclick="startPvP(3)">

3 Players

</button>

<button
class="menuBtn"
onclick="startPvP(4)">

4 Players

</button>

<button
class="menuBtn"
onclick="goMenu()">

⬅ Back

</button>

</div>

</div>

<!-- BOT -->

<div
class="screen"
id="bots">

<div class="card">

<h2>

Choose Difficulty

</h2>

<button
class="menuBtn"
onclick="startBot('easy')">

🟢 Easy

</button>

<button
class="menuBtn"
onclick="startBot('medium')">

🟡 Medium

</button>

<button
class="menuBtn"
onclick="startBot('hard')">

🔴 Hard

</button>

<button
class="menuBtn"
onclick="goMenu()">

⬅ Back

</button>

</div>

</div>

<!-- GAME -->

<div
class="screen"
id="game">

<div class="card">

<div
class="rankBox">

🏆

<span id="rank">

Bronze

</span>

|

RP

<span id="rp">

0

</span>

|

🔥

<span id="streak">

0

</span>

</div>

<div
class="timer"
id="timer">

<div
class="fill"
id="fill">

</div>

</div>

<div
class="status"
id="status">

Player X Turn

</div>

<div
class="board"
id="board">

</div>

<div
class="controls">

<button
class="control"
onclick="restart()">

🔄 Restart

</button>

<button
class="control"
onclick="goMenu()">

⬅ Menu

</button>

</div>

</div>

</div>

<script>

let gameBoard=[];

let players=["X","O"];

let current=0;

let size=3;

let need=3;

let speed=false;

let ranked=false;

let rp=0;

let streak=0;

let timerLoop;

function hide(){

document
.querySelectorAll(
".screen"
)

.forEach(

x=>x.classList
.remove(
"active"
)

)

}

function openCasual(){

hide();

casual.classList
.add("active");

}

function openBots(){

hide();

bots.classList
.add("active");

}

function rankedGame(){

ranked=true;

speed=false;

players=["X","O"];

size=3;

need=3;

openGame();

}

function speedrun(){

ranked=false;

speed=true;

players=["X","O"];

size=3;

need=3;

openGame();

}

function startPvP(n){

ranked=false;

speed=false;

players=

["X","O","△","□"]

.slice(0,n);

size=

n==2?3:

n==3?4:5;

need=

n==4?4:3;

openGame();

}

function startBot(){

players=["X","O"];

speed=false;

size=3;

need=3;

openGame();

}

function openGame(){

hide();

game.classList
.add("active");

build();

}

function build(){

gameBoard=[];

current=0;

board.innerHTML="";

for(

let i=0;

i<size*size;

i++

)

gameBoard.push("");

board.style
.gridTemplateColumns=

`repeat(${size},85px)`;

for(

let i=0;

i<gameBoard.length;

i++

){

let cell=

document
.createElement(
"div"
);

cell.className=
"cell";

cell.onclick=
()=>move(i);

board.append(
cell
);

}

timer.style.display=

speed

?"block"

:"none";

if(speed)
startTimer();

update();

}

function move(i){

if(gameBoard[i])
return;

gameBoard[i]=

players[current];

render();

current=

(current+1)

%

players.length;

update();

if(speed)
startTimer();

}

function render(){

document
.querySelectorAll(
".cell"
)

.forEach(

(c,i)=>{

c.innerHTML=

gameBoard[i];

c.className=
"cell";

if(
gameBoard[i]=="X"
)

c.classList
.add("x");

if(
gameBoard[i]=="O"
)

c.classList
.add("o");

}

)

}

function update(){

status.innerHTML=

players[current]

+

" Turn"

}

function restart(){

build();

}

function startTimer(){

clearInterval(
timerLoop
)

let t=100;

fill.style.width=
"100%";

timerLoop=

setInterval(()=>{

t-=10;

fill.style.width=

t+"%";

if(t<=0){

clearInterval(
timerLoop
);

current=

(current+1)

%

players.length;

update();

startTimer();

}

},100)

}

function goMenu(){

speed=false;

hide();

menu.classList
.add("active")

}

</script>

</body>
</html>
